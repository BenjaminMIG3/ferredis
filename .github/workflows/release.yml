name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (egui + deb/apt)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            dpkg-dev apt-utils
      - name: Package tarball
        run: bash packaging/package.sh
      - name: Package .deb + dépôt apt
        run: |
          bash packaging/debian/package-deb.sh
          bash packaging/debian/build-repo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ferredis-linux-x86_64
          path: |
            dist/ferredis-linux-x86_64.tar.gz
            dist/ferredis_*.deb
            dist/apt/**

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package zip
        run: pwsh -File packaging/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ferredis-windows-x86_64
          path: dist/ferredis-windows-x86_64.zip

  package-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Bootstrap pacman
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git rust cargo clang pkgconf \
            libxkbcommon libxcb rsync tar
      - uses: actions/checkout@v4
      - name: Build pacman package + repo db
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          sudo -u builder bash packaging/archlinux/package-arch.sh
          sudo -u builder bash packaging/archlinux/build-repo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ferredis-archlinux
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.xz
            dist/PKGBUILD
            dist/archlinux/**

  release:
    needs: [package-linux, package-windows, package-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble dist/
        run: |
          mkdir -p dist/archlinux/x86_64 dist/apt
          find artifacts -type f -name 'ferredis-linux-*.tar.gz' -exec cp -f {} dist/ \;
          find artifacts -type f -name 'ferredis-windows-*.zip' -exec cp -f {} dist/ \;
          find artifacts -type f -name 'ferredis_*.deb' -exec cp -f {} dist/ \;
          find artifacts -type f \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' \) -exec cp -f {} dist/ \;
          find artifacts -type f -name 'PKGBUILD' -exec cp -f {} dist/ \;
          if [ -d artifacts/ferredis-archlinux/archlinux ]; then
            cp -a artifacts/ferredis-archlinux/archlinux/. dist/archlinux/
          else
            find artifacts -type d -name x86_64 | head -1 | while read -r d; do
              cp -a "$d"/. dist/archlinux/x86_64/ || true
            done
          fi
          if [ -d artifacts/ferredis-linux-x86_64/apt ]; then
            cp -a artifacts/ferredis-linux-x86_64/apt/. dist/apt/
          else
            find artifacts -type d -path '*/apt/dists' | head -1 | while read -r d; do
              cp -a "$(dirname "$d")"/. dist/apt/ || true
            done
          fi
          ls -laR dist/
      - name: Upload GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ferredis-linux-x86_64.tar.gz
            dist/ferredis-windows-x86_64.zip
            dist/ferredis_*.deb
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.xz
            dist/PKGBUILD
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Conserve les artefacts du run pour le workflow deploy-pages (workflow_run).
      - name: Upload site bundle for Pages
        uses: actions/upload-artifact@v4
        with:
          name: ferredis-pages-dist
          path: dist/

  # Met à jour bucket/ferredis.json sur main (hash + version) après une release taguée.
  update-scoop:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: ferredis-windows-x86_64
          path: dist
      - name: Update Scoop manifest
        run: bash packaging/scoop/update-manifest.sh "${GITHUB_REF_NAME}" dist/ferredis-windows-x86_64.zip
      - name: Commit & push bucket
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ferredis.json
          if git diff --staged --quiet; then
            echo "Manifest Scoop déjà à jour"
            exit 0
          fi
          git commit -m "chore(scoop): bump ferredis to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
