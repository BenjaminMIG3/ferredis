name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ferredis-linux-x86_64.tar.gz
            script: bash packaging/package.sh
          - os: windows-latest
            artifact: ferredis-windows-x86_64.zip
            script: pwsh -File packaging/package.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  benches-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit benches (smoke)
        run: cargo test -p ferredis-core --release -- --ignored bench_smoke || cargo test -p ferredis-compat p12:: --release
