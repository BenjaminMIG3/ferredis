name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (egui)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Package tarball
        run: bash packaging/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ferredis-linux-x86_64
          path: dist/ferredis-linux-x86_64.tar.gz

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package zip
        run: pwsh -File packaging/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ferredis-windows-x86_64
          path: dist/ferredis-windows-x86_64.zip

  package-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Bootstrap pacman
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git rust cargo clang pkgconf \
            libxkbcommon libxcb rsync tar
      - uses: actions/checkout@v4
      - name: Build pacman package + repo db
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          sudo -u builder bash packaging/archlinux/package-arch.sh
          sudo -u builder bash packaging/archlinux/build-repo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ferredis-archlinux
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.xz
            dist/PKGBUILD
            dist/archlinux/**

  release:
    needs: [package-linux, package-windows, package-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble dist/
        run: |
          mkdir -p dist/archlinux/x86_64
          find artifacts -type f -name 'ferredis-linux-*.tar.gz' -exec cp -f {} dist/ \;
          find artifacts -type f -name 'ferredis-windows-*.zip' -exec cp -f {} dist/ \;
          find artifacts -type f \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' \) -exec cp -f {} dist/ \;
          find artifacts -type f -name 'PKGBUILD' -exec cp -f {} dist/ \;
          # Copie arbo dépôt pacman si présente
          if [ -d artifacts/ferredis-archlinux/archlinux ]; then
            cp -a artifacts/ferredis-archlinux/archlinux/. dist/archlinux/
          else
            find artifacts -type d -name x86_64 | head -1 | while read -r d; do
              cp -a "$d"/. dist/archlinux/x86_64/ || true
            done
          fi
          # Index HTML simple pour navigation / téléchargements
          cat > dist/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8"><title>Ferredis downloads</title></head>
          <body>
          <h1>Ferredis — téléchargements</h1>
          <ul>
            <li><a href="ferredis-linux-x86_64.tar.gz">Linux x86_64 (tarball + systemd)</a></li>
            <li><a href="ferredis-windows-x86_64.zip">Windows x86_64 (zip + service)</a></li>
            <li><a href="archlinux/x86_64/">Dépôt pacman Arch (x86_64)</a></li>
          </ul>
          <p>Arch : ajoutez le dépôt puis <code>sudo pacman -Syu ferredis</code> — voir README.</p>
          </body></html>
          HTML
          ls -laR dist/
      - name: Upload GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ferredis-linux-x86_64.tar.gz
            dist/ferredis-windows-x86_64.zip
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.xz
            dist/PKGBUILD
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
