name: ci

on:
  push:
  pull_request:

# Gate bi-OS : les deux jobs doivent être verts pour merger une phase.
# Politique anti-stub : voir PLAN.md et ferredis-core/src/command_matrix.rs

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (debug)
        run: cargo test --workspace --exclude ferredis-gui
      - name: Build server/cli
        run: cargo build -p ferredis-server -p ferredis-cli
