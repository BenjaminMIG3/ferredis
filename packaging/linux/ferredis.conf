# Configuration Ferredis (compatible style redis.conf)
# Chemins adaptés au packaging Linux / systemd.

bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
dir /var/lib/ferredis
dbfilename dump.rdb
appendonly no
appendfilename appendonly.aof
appendfsync everysec
maxmemory 0
maxmemory-policy noeviction
tcp-keepalive 300
timeout 0
hz 10
databases 16
# requirepass yourpassword
# unixsocket /run/ferredis/ferredis.sock
# unixsocketperm 770
